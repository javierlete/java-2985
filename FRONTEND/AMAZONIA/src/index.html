<!doctype html>
<html lang="es" class="h-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="h-100 d-flex flex-column justify-content-between">
    <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Amazonia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-sm-0">
                    <li class="nav-item">
                        <a class="nav-link" href="javascript:mostrarCatalogo()">Principal</a>
                    </li>
                </ul>
                <ul class="navbar-nav mb-2 mb-sm-0">
                    <li class="nav-item">
                        <a class="nav-link" href="javascript:mostrarAdministracion()">Administración</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <section id="catalogo">
            <h1>Catálogo</h1>
            <div id="marco-catalogo"
                class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 row-cols-xxl-6 g-4">

            </div>
        </section>

        <section id="detalle">
            <h1>Producto</h1>

            <article class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-4">
                        <img src="https://picsum.photos/400/400" class="img-fluid rounded-start" alt="...">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <h5 class="card-title">Portátil</h5>
                            <p class="card-text"></p>
                            <dl>
                                <dt>Pantalla</dt>
                                <dd>1080 FullHD</dd>
                            </dl>
                            <p class="card-text d-flex justify-content-between">
                                <small class="text-body-secondary">1.234,00€</small>
                                <a class="btn btn-primary" href="javascript:mostrarCatalogo()">Atrás</a>
                            </p>
                        </div>
                    </div>
                </div>
            </article>
        </section>

        <section id="administracion">
            <h1>Administración</h1>

            <div class="table-responsive">
                <table class="table table-hover table-striped table-bordered">
                    <thead class="table-secondary">
                        <tr>
                            <th>Id</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>OPCIONES</th>
                        </tr>
                    </thead>

                    <tbody>

                    </tbody>

                    <tfoot class="table-secondary">
                        <tr>
                            <td colspan="3"></td>
                            <td>
                                <a href="javascript:mostrarFormulario()" class="btn btn-sm btn-primary">
                                    <i class="bi bi-plus-lg"></i>
                                </a>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

        <section id="formulario">
            <h1>Formulario producto</h1>

            <form>
                <div class="row mb-3">
                    <label for="id" class="col-sm-2 col-form-label">Id</label>
                    <div class="col-sm">
                        <input type="number" readonly class="form-control" id="id" name="id-producto">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm">
                        <input type="text" class="form-control" id="nombre" name="nombre">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="imagen" class="col-sm-2 col-form-label">Imagen</label>
                    <div class="col-sm">
                        <input type="text" class="form-control" id="imagen" name="imagen">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="ean" class="col-sm-2 col-form-label">EAN</label>
                    <div class="col-sm">
                        <input type="text" class="form-control" id="ean" name="ean">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="precio" class="col-sm-2 col-form-label">Precio</label>
                    <div class="col-sm-10">
                        <input type="number" step=".01" class="form-control" id="precio" name="precio">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="descripcion" class="col-sm-2 col-form-label">Descripción</label>
                    <div class="col-sm">
                        <textarea class="form-control" id="descripcion" name="descripcion"></textarea>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="offset-sm-2 col-sm">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i></button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer class="p-2 text-bg-dark">
        <p>&copy; 2026 Javier Lete</p>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/amazonia.js"></script>
</body>

</html>
